[package]
name = "freebuff-patcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Disables advertisement surfaces in the Freebuff Terminal Bun executable by exact-length byte patching."

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
